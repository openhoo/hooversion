name: Setup Hooversion
description: Download a Hooversion release binary and add it to PATH.
inputs:
  version:
    description: Hooversion release version to install.
    required: false
    default: "1.0.7"
outputs:
  version:
    description: Hooversion version configured by this action.
    value: ${{ steps.binaries.outputs.version }}
runs:
  using: composite
  steps:
    - name: Download and install Hooversion
      id: binaries
      shell: bash
      env:
        HOOVERSION_VERSION: ${{ inputs.version }}
        RUNNER_OS_VALUE: ${{ runner.os }}
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
