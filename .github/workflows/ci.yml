name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dogfood Hooversion commit lint action
        uses: ./actions/lint
        with:
          version: 1.0.6

  build:
    name: Test and build
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run checks
        run: go vet ./... && go test ./... -race -count=1 && go build ./...

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@f1b9be32483e3353e38ef3b5703217d2723e735e # v0.2.4
        with:
          version: 0.2.4

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@5446c51a79d115048601d3f42d6a9127b49fb322 # v0.6.3
        with:
          version: 0.6.3
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@0ed50de75e6e8c097c44e6b50a16f6d8817acedf # v0.2.3
        with:
          version: 0.2.3
          paths: |
            cmd
            internal
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@4a833fd00dafc8fb017d5cabec0c38dddba4bc70 # v0.1.1
        with:
          version: 0.1.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
