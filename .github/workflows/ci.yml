name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dogfood Hooversion commit lint action
        uses: ./actions/lint
        with:
          version: 1.1.0

  build:
    name: Test and build
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run checks
        run: go vet ./... && go test ./... -race -count=1 && go build ./...

  windows:
    name: Windows spool and config
    runs-on: windows-latest
    needs: commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Test Windows spool and config
        run: go test ./internal/app ./internal/config -count=1

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@46529a99335938e7284f11099bf15f7e1800e6f5 # v0.3.1
        with:
          version: 0.3.1

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@f2b28d71398749142f4d9366b0427369f3af6e02 # v0.6.5
        with:
          version: 0.6.5
          policy: hooray-policy.yaml
          format: table
          output: ""


      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@11e4d2d44f5e34d11a7c03e4a87eea857ceea8ed # v0.3.0
        with:
          version: 0.3.0
          paths: |
            cmd
            internal
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@ffd31b013dafcd772bb067a0eec76f739ecd76a3 # v0.3.1
        with:
          version: 0.3.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
