name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild assets; leave empty to prepare a release from main'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.tag == ''
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Configure release git author
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Prepares manifests, changelog, release commit and annotated tags
      # locally (--no-push) without touching GitHub (--no-github). Emits
      # published/version/tag into GITHUB_OUTPUT; no-op when nothing is due.
      - name: Cut release commit and tags
        id: rel
        run: go run ./cmd/hooversion release --no-push --no-github

      - name: Push release branch
        id: push
        if: steps.rel.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          branch="release/${tag}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Report release pull request URL
        if: steps.push.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.push.outputs.branch }}
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${RELEASE_BRANCH}?expand=1"
          {
            echo "## Release branch ready"
            echo
            echo "Open and merge the protected release PR: [${RELEASE_TAG}]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Read and verify release metadata
        id: meta
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v${version}"
          test "$(git log -1 --format=%s HEAD)" = "chore(release): hooversion ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Tag the checked, protected-branch release commit. The prepare job keeps
      # its pre-rebase tag local so no published tag can point outside main.
      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          remote_ref=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")
          if [ -n "$remote_ref" ]; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$expected"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "hooversion ${{ steps.meta.outputs.version }}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        if: steps.release.outputs.published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${RELEASE_VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = "windows" ]; then
              ext=.exe
            fi
            stage="dist/hooversion_${RELEASE_VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/hooversion${ext}" ./cmd/hooversion
            install -m 0644 LICENSE "$stage/LICENSE"
            tar -czf "dist/hooversion_${RELEASE_VERSION}_${os}_${arch}.tar.gz" -C "$stage" "hooversion${ext}" LICENSE
            rm -rf "$stage"
          done

      - name: Generate SPDX SBOM
        if: steps.release.outputs.published == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/hooversion_${{ steps.meta.outputs.tag }}.spdx.json
          artifact-name: hooversion-sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        if: steps.release.outputs.published == 'true'
        run: cd dist && sha256sum -- *.tar.gz *.spdx.json | sort -k2 > SHA256SUMS

      - name: Install Cosign
        if: steps.release.outputs.published == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        if: steps.release.outputs.published == 'true'
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        if: steps.release.outputs.published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release assets
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" dist/* --clobber

  rebuild-assets:
    name: Rebuild assets
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      REBUILD_TAG: ${{ inputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Validate rebuild tag input
        shell: bash
        env:
          REBUILD_TAG: ${{ env.REBUILD_TAG }}
        run: |
          set -euo pipefail
          if [[ ! "$REBUILD_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::rebuild tag must be a stable semantic version prefixed with v." >&2
            exit 2
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REBUILD_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Read and verify release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_TAG: ${{ env.REBUILD_TAG }}
        run: |
          set -euo pipefail
          version="${REBUILD_TAG#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse --verify "${REBUILD_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          test "$tag_commit" = "$head_commit"
          test "$(git log -1 --format=%s HEAD)" = "chore(release): hooversion ${version}"
          git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main
          gh release view "$REBUILD_TAG" >/dev/null
          {
            echo "version=$version"
            echo "tag=$REBUILD_TAG"
            echo "commit=$head_commit"
          } >> "$GITHUB_OUTPUT"
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${RELEASE_VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = "windows" ]; then
              ext=.exe
            fi
            stage="dist/hooversion_${RELEASE_VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/hooversion${ext}" ./cmd/hooversion
            install -m 0644 LICENSE "$stage/LICENSE"
            tar -czf "dist/hooversion_${RELEASE_VERSION}_${os}_${arch}.tar.gz" -C "$stage" "hooversion${ext}" LICENSE
            rm -rf "$stage"
          done

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/hooversion_v${{ steps.meta.outputs.version }}.spdx.json
          artifact-name: hooversion-sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.spdx.json | sort -k2 > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
