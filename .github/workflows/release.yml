name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-upload assets for (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Configure release git author
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Prepares manifests, changelog, release commit and annotated tags
      # locally (--no-push) without touching GitHub (--no-github). Emits
      # published/version/tag into GITHUB_OUTPUT; no-op when nothing is due.
      - name: Cut release commit and tags
        id: rel
        run: go run ./cmd/hooversion release --no-push --no-github

      - name: Push release branch and tags
        id: push
        if: steps.rel.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          branch="release/${tag}"
          git push origin "HEAD:refs/heads/${branch}" "refs/tags/${tag}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open and merge release PR
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.push.outputs.branch }}
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          # Detached-HEAD checkout: gh cannot infer the PR, so thread the
          # explicit URL from create into merge.
          pr_url=$(gh pr create \
            --base main --head "${RELEASE_BRANCH}" \
            --title "chore(release): hooversion ${RELEASE_VERSION}" \
            --body "Automated release PR for \`${RELEASE_TAG}\`. Merging publishes the GitHub Release.")
          # Required status checks gate the merge; retry until they settle.
          ok=
          for _ in $(seq 1 60); do
            if gh pr merge "$pr_url" --rebase \
                 --subject "chore(release): hooversion ${RELEASE_VERSION}"; then
              ok=1
              break
            fi
            sleep 20
          done
          [ -n "$ok" ] || { echo "release PR did not become mergeable in time: $pr_url" >&2; exit 1; }

  publish:
    name: Publish release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Configure release git author
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Resumes the SHA-bound plan from the verified release commit/tag,
      # pushes the tag atomically, and creates the GitHub Release.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/hooversion release

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        if: steps.release.outputs.published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${RELEASE_VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = "windows" ]; then
              ext=.exe
            fi
            stage="dist/hooversion_${RELEASE_VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/hooversion${ext}" ./cmd/hooversion
            tar -czf "dist/hooversion_${RELEASE_VERSION}_${os}_${arch}.tar.gz" -C "$stage" "hooversion${ext}"
            rm -rf "$stage"
          done

      - name: Generate checksums
        if: steps.release.outputs.published == 'true'
        run: (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Upload release assets
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber

  rebuild-assets:
    name: Rebuild assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${RELEASE_VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = "windows" ]; then
              ext=.exe
            fi
            stage="dist/hooversion_${RELEASE_VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/hooversion${ext}" ./cmd/hooversion
            tar -czf "dist/hooversion_${RELEASE_VERSION}_${os}_${arch}.tar.gz" -C "$stage" "hooversion${ext}"
            rm -rf "$stage"
          done

      - name: Generate checksums
        run: (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
