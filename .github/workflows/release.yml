name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && !contains(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Configure release git author
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/hooversion release

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${RELEASE_VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = "windows" ]; then
              ext=.exe
            fi
            stage="dist/hooversion_${RELEASE_VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/hooversion${ext}" ./cmd/hooversion
            tar -czf "dist/hooversion_${RELEASE_VERSION}_${os}_${arch}.tar.gz" -C "$stage" "hooversion${ext}"
            rm -rf "$stage"
          done

      - name: Generate checksums
        if: steps.release.outputs.published == 'true'
        run: (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Upload release assets
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber
